<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<div class="auth-box">
    <div class="auth-content">

        <img src="logo.png" class="logo" alt="Logo">

        <h1>Create Account</h1>
        <p class="subtitle">Create your normal user account</p>

        <div id="message" class="message"></div>

        <form id="registerForm">

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    id="username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Phone number</label>
                <input
                    type="tel"
                    id="phone"
                    autocomplete="tel"
                >
            </div>

            <div class="form-group">
                <label>Age</label>
                <input
                    type="number"
                    id="age"
                    min="1"
                    max="120"
                >
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input
                    type="date"
                    id="dob"
                    required
                >
            </div>

            <div class="form-group">
                <label>Gender</label>

                <select id="gender">
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Country</label>

                <input
                    type="text"
                    id="country"
                    list="countrySuggestions"
                    autocomplete="country-name"
                    placeholder="Search and select your country"
                >
                <datalist id="countrySuggestions"><option value="Afghanistan"><option value="Albania"><option value="Algeria"><option value="Andorra"><option value="Angola"><option value="Antigua and Barbuda"><option value="Argentina"><option value="Armenia"><option value="Australia"><option value="Austria"><option value="Azerbaijan"><option value="Bahamas"><option value="Bahrain"><option value="Bangladesh"><option value="Barbados"><option value="Belarus"><option value="Belgium"><option value="Belize"><option value="Benin"><option value="Bhutan"><option value="Bolivia"><option value="Bosnia and Herzegovina"><option value="Botswana"><option value="Brazil"><option value="Brunei"><option value="Bulgaria"><option value="Burkina Faso"><option value="Burundi"><option value="Cabo Verde"><option value="Cambodia"><option value="Cameroon"><option value="Canada"><option value="Central African Republic"><option value="Chad"><option value="Chile"><option value="China"><option value="Colombia"><option value="Comoros"><option value="Congo (Republic of the)"><option value="Costa Rica"><option value="Côte d’Ivoire"><option value="Croatia"><option value="Cuba"><option value="Cyprus"><option value="Czechia"><option value="Democratic Republic of the Congo"><option value="Denmark"><option value="Djibouti"><option value="Dominica"><option value="Dominican Republic"><option value="Ecuador"><option value="Egypt"><option value="El Salvador"><option value="Equatorial Guinea"><option value="Eritrea"><option value="Estonia"><option value="Eswatini"><option value="Ethiopia"><option value="Fiji"><option value="Finland"><option value="France"><option value="Gabon"><option value="Gambia"><option value="Georgia"><option value="Germany"><option value="Ghana"><option value="Greece"><option value="Grenada"><option value="Guatemala"><option value="Guinea"><option value="Guinea-Bissau"><option value="Guyana"><option value="Haiti"><option value="Honduras"><option value="Hungary"><option value="Iceland"><option value="India"><option value="Indonesia"><option value="Iran"><option value="Iraq"><option value="Ireland"><option value="Israel"><option value="Italy"><option value="Jamaica"><option value="Japan"><option value="Jordan"><option value="Kazakhstan"><option value="Kenya"><option value="Kiribati"><option value="Kuwait"><option value="Kyrgyzstan"><option value="Laos"><option value="Latvia"><option value="Lebanon"><option value="Lesotho"><option value="Liberia"><option value="Libya"><option value="Liechtenstein"><option value="Lithuania"><option value="Luxembourg"><option value="Madagascar"><option value="Malawi"><option value="Malaysia"><option value="Maldives"><option value="Mali"><option value="Malta"><option value="Marshall Islands"><option value="Mauritania"><option value="Mauritius"><option value="Mexico"><option value="Micronesia"><option value="Moldova"><option value="Monaco"><option value="Mongolia"><option value="Montenegro"><option value="Morocco"><option value="Mozambique"><option value="Myanmar"><option value="Namibia"><option value="Nauru"><option value="Nepal"><option value="Netherlands"><option value="New Zealand"><option value="Nicaragua"><option value="Niger"><option value="Nigeria"><option value="North Korea"><option value="North Macedonia"><option value="Norway"><option value="Oman"><option value="Pakistan"><option value="Palau"><option value="Palestine"><option value="Panama"><option value="Papua New Guinea"><option value="Paraguay"><option value="Peru"><option value="Philippines"><option value="Poland"><option value="Portugal"><option value="Qatar"><option value="Romania"><option value="Russia"><option value="Rwanda"><option value="Saint Kitts and Nevis"><option value="Saint Lucia"><option value="Saint Vincent and the Grenadines"><option value="Samoa"><option value="San Marino"><option value="Sao Tome and Principe"><option value="Saudi Arabia"><option value="Senegal"><option value="Serbia"><option value="Seychelles"><option value="Sierra Leone"><option value="Singapore"><option value="Slovakia"><option value="Slovenia"><option value="Solomon Islands"><option value="Somalia"><option value="South Africa"><option value="South Korea"><option value="South Sudan"><option value="Spain"><option value="Sri Lanka"><option value="Sudan"><option value="Suriname"><option value="Sweden"><option value="Switzerland"><option value="Syria"><option value="Taiwan"><option value="Tajikistan"><option value="Tanzania"><option value="Thailand"><option value="Timor-Leste"><option value="Togo"><option value="Tonga"><option value="Trinidad and Tobago"><option value="Tunisia"><option value="Türkiye"><option value="Turkmenistan"><option value="Tuvalu"><option value="Uganda"><option value="Ukraine"><option value="United Arab Emirates"><option value="United Kingdom"><option value="United States"><option value="Uruguay"><option value="Uzbekistan"><option value="Vanuatu"><option value="Vatican City"><option value="Venezuela"><option value="Vietnam"><option value="Yemen"><option value="Zambia"><option value="Zimbabwe"></datalist>
            </div>

            <div class="form-group">
                <label>Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        autocomplete="new-password"
                        minlength="6"
                        maxlength="20"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('password', this)"
                    >👁</button>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirmPassword"
                        autocomplete="new-password"
                        minlength="6"
                        maxlength="20"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('confirmPassword', this)"
                    >👁</button>
                </div>
            </div>

            <button class="btn" type="submit">
                Create Account
            </button>

        </form>

        <div class="auth-links">
            <a href="index.html">I already have an account</a>
        </div>

    </div>
</div>

<script>
const USERS_KEY = "app_users_v2";
const ADMIN_KEY = "app_admin_v2";

function generateId() {
    return "user_" + Date.now() + "_" + Math.random().toString(36).substring(2, 9);
}

function readJSON(key, fallback) {
    try {
        return JSON.parse(localStorage.getItem(key)) ?? fallback;
    } catch {
        return fallback;
    }
}

function getUsers() {
    let users = readJSON(USERS_KEY, []);

    if (!Array.isArray(users)) {
        users = [];
    }

    let changed = false;

    users = users.map(user => {

        if (!user.id) {
            user.id = generateId();
            changed = true;
        }

        user.role = "user";

        if (typeof user.disabled !== "boolean") {
            user.disabled = false;
            changed = true;
        }

        return user;
    });

    if (changed) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    return users;
}

function saveUsers(users) {
    localStorage.setItem(USERS_KEY, JSON.stringify(users));
}

function getAdmin() {
    let admin = readJSON(ADMIN_KEY, null);

    if (!admin) {
        admin = {
            id: "admin",
            name: "Administrator",
            username: "admin",
            email: "admin@mywebsite.com",
            password: "Admin12345",
            role: "admin"
        };

        localStorage.setItem(ADMIN_KEY, JSON.stringify(admin));
    }

    return admin;
}


const API_BASE = window.location.protocol === "file:" ? "http://localhost:3000/api" : "/api";

async function createSharedAccount(account) {
    try {
        const response = await fetch(`${API_BASE}/register`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(account)
        });
        const data = await response.json();
        return {ok: response.ok, data};
    } catch {
        return {ok: false, data: null};
    }
}

function showMessage(text, type = "error") {
    const message = document.getElementById("message");

    message.textContent = text;
    message.className = "message " + type;
}

function togglePassword(id, button) {

    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "🙈";
    } else {
        input.type = "password";
        button.textContent = "👁";
    }
}

document
.getElementById("registerForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const users = getUsers();
    const admin = getAdmin();

    const name = document.getElementById("name").value.trim();
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const phone = document.getElementById("phone").value.trim();
    const age = document.getElementById("age").value;
    const dob = document.getElementById("dob").value;
    const gender = document.getElementById("gender").value;
    const country = document.getElementById("country").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        showMessage("Passwords do not match.");
        return;
    }

    if (password.length < 6) {
        showMessage("Password must contain at least 6 characters.");
        return;
    }

    const usernameExists =
        users.some(
            user =>
                String(user.username || "").toLowerCase() ===
                username.toLowerCase()
        ) ||
        String(admin.username || "").toLowerCase() ===
        username.toLowerCase();

    if (usernameExists) {
        showMessage("That username is already in use.");
        return;
    }

    const emailExists =
        users.some(
            user =>
                String(user.email || "").toLowerCase() === email
        ) ||
        String(admin.email || "").toLowerCase() === email;

    if (emailExists) {
        showMessage("That email is already registered.");
        return;
    }

    const newUser = {
        id: generateId(),
        role: "user",

        name,
        username,
        email,
        phone,
        age,
        dob,
        gender,
        country,

        password,

        disabled: false,
        notifications: true,

        profilePicture: "",

        createdAt: new Date().toISOString()
    };


    const sharedResult = await createSharedAccount(newUser);

    if (sharedResult.ok) {
        showMessage("Account created successfully. You can now log in.", "success");
        document.getElementById("registerForm").reset();

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1200);
        return;
    }

    users.push(newUser);

    saveUsers(users);

    showMessage(
        "Account created successfully. You can now log in.",
        "success"
    );

    document.getElementById("registerForm").reset();

    setTimeout(() => {
        window.location.href = "index.html";
    }, 1200);
});
</script>

</body>
</html>
