services:
  - type: web
    name: shared-dashboard-app
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
    disk:
      name: dashboard-data
      mountPath: /var/data
      sizeGB: 1
