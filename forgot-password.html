<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<div class="auth-box">
    <div class="auth-content">

        <img src="logo.png" class="logo" alt="Logo">

        <h1>Reset Password</h1>
        <p class="subtitle">Reset your account password</p>

        <div id="message" class="message"></div>

        <form id="resetForm">

            <div class="form-group">
                <label>Username or Email</label>

                <input
                    type="text"
                    id="identifier"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label>New Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="newPassword"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('newPassword', this)"
                    >👁</button>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirmPassword"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('confirmPassword', this)"
                    >👁</button>
                </div>
            </div>

            <button class="btn" type="submit">
                Reset Password
            </button>

        </form>

        <div class="auth-links">
            <a href="index.html">Back to Login</a>
        </div>

    </div>
</div>

<script>
const USERS_KEY = "app_users_v2";
const ADMIN_KEY = "app_admin_v2";

function readJSON(key, fallback) {
    try {
        return JSON.parse(localStorage.getItem(key)) ?? fallback;
    } catch {
        return fallback;
    }
}


const API_BASE = window.location.protocol === "file:" ? "http://localhost:3000/api" : "/api";

async function resetSharedPassword(identifier, password) {
    try {
        const response = await fetch(`${API_BASE}/reset-password`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({identifier, password})
        });
        return {ok: response.ok, data: await response.json()};
    } catch {
        return {ok: false, data: null};
    }
}

function togglePassword(id, button) {

    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "🙈";
    } else {
        input.type = "password";
        button.textContent = "👁";
    }
}

function showMessage(text, type = "error") {

    const message = document.getElementById("message");

    message.textContent = text;
    message.className = "message " + type;
}

document
.getElementById("resetForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    let users = readJSON(USERS_KEY, []);
    const admin = readJSON(ADMIN_KEY, null);

    const identifier =
        document.getElementById("identifier").value.trim().toLowerCase();

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (newPassword !== confirmPassword) {
        showMessage("Passwords do not match.");
        return;
    }

    if (newPassword.length < 6) {
        showMessage("Password must contain at least 6 characters.");
        return;
    }

    /* Check admin */

    if (
        admin &&
        (
            String(admin.username || "").toLowerCase() === identifier ||
            String(admin.email || "").toLowerCase() === identifier
        )
    ) {

        admin.password = newPassword;

        localStorage.setItem(
            ADMIN_KEY,
            JSON.stringify(admin)
        );

        showMessage(
            "Admin password changed successfully.",
            "success"
        );

        return;
    }

    /* Check normal users */

    const user = users.find(u =>
        String(u.username || "").toLowerCase() === identifier ||
        String(u.email || "").toLowerCase() === identifier
    );

    if (!user) {
        showMessage("Account not found.");
        return;
    }

    user.password = newPassword;

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );

    showMessage(
        "Password changed successfully.",
        "success"
    );
});
</script>

</body>
</html>
